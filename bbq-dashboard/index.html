<!doctype html><html lang="en-AU"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917"><meta name="apple-mobile-web-app-capable" content="yes">
<title>BBQ Dashboard</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/favicon.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css"></head><body>
<header><h1>🔥 BBQ Dashboard</h1><p>Pick what's going on the barbie.</p></header>
<main>
<section><h2>Proteins</h2><div id="proteins" class="grid"></div><div id="kgs"></div></section>
<section><h2>Vegetables</h2><div id="veg" class="grid"></div></section>
<button id="fire" class="big">Fire up 🔥</button>
<section id="setup" class="hero"></section>
<section id="board-wrap"><div class="row"><h2>Timers</h2><button id="startall">Start all</button></div><div id="board"></div></section>
<p class="safe">Times are a home-cook guide. Use a meat thermometer for chicken, sausages and burgers — 75°C in the centre. Whole-muscle steaks and chops can follow your preferred doneness. Rest meat a few minutes after it comes off.</p>
</main><script src="app.js"></script></body></html>
